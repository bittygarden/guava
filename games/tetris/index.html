  <body>
    <main id="app">
      <section id="game-shell" aria-label="环界方块游戏区域">
        <canvas id="game-canvas" aria-label="圆柱体俄罗斯方块三维场景"></canvas>

        <header class="brand">
          <span class="eyebrow">CYLINDRICAL TETRIS</span>
          <h1>环界方块</h1>
        </header>

        <div class="audio-controls" aria-label="声音控制">
          <button id="audio-master-toggle" type="button" aria-pressed="true">所有声音 <span>开</span></button>
          <button id="music-toggle" type="button" aria-pressed="true">背景音乐 <span>开</span></button>
          <button id="effects-toggle" type="button" aria-pressed="true">消除音效 <span>开</span></button>
        </div>

        <aside class="stats" aria-label="游戏状态">
          <div><span>分数</span><strong id="score">000000</strong></div>
          <div><span>环带</span><strong id="lines">00</strong></div>
          <div><span>等级</span><strong id="level">01</strong></div>
        </aside>

        <aside class="next-panel">
          <span>下一块</span>
          <strong id="next-piece">T</strong>
          <span class="hold-label">暂存</span>
          <strong id="hold-piece">—</strong>
        </aside>

        <div class="hint" id="hint">转动圆柱 · 对准落点 · 填满整圈</div>

        <div class="controls" aria-label="操作说明">
          <span><kbd>A</kbd><kbd>D</kbd> 旋转圆柱</span>
          <span><kbd>W</kbd> 旋转</span>
          <span><kbd>S</kbd> 软降</span>
          <span><kbd>Space</kbd> 硬降</span>
          <span><kbd>C</kbd> 暂存</span>
          <span><kbd>Esc</kbd> 暂停</span>
        </div>

        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <span class="eyebrow">3D CYLINDRICAL PUZZLE</span>
            <h2 id="overlay-title">转动世界，拼出完整一环</h2>
            <p id="overlay-copy">方块始终落在眼前，转动圆柱选择落点。让色彩首尾相接，填满一整圈，释放连续消除。</p>
            <button id="start-button" type="button">进入环界</button>
          </div>
        </div>
      </section>
    </main>
  </body>
